---
apiVersion: v1
kind: Namespace
metadata:
  name: shoot--foobar--azure
---
apiVersion: v1
kind: Secret
metadata:
  namespace: shoot--foobar--azure
  name: core-azure
type: Opaque
#data:
#  clientID: base64(clientID)
#  clientSecret: base64(clientSecret)
#  subscriptionID: base64(subscriptionID)
#  tenantID: base64(tenantID)
---
apiVersion: extensions.gardener.cloud/v1alpha1
kind: Cluster
metadata:
  name: shoot--foobar--azure
spec:
  cloudProfile:
    apiVersion: core.gardener.cloud/v1beta1
    kind: CloudProfile
    spec:
      providerConfig:
        apiVersion: azure.provider.extensions.gardener.cloud/v1alpha1
        kind: CloudProfileConfig
        countFaultDomains:
        - region: westeurope
          count: 2
        countUpdateDomains:
        - region: westeurope
          count: 5
  seed:
    apiVersion: core.gardener.cloud/v1beta1
    kind: Seed
  shoot:
    apiVersion: core.gardener.cloud/v1beta1
    kind: Shoot
    spec:
      networking:
        pods: 10.243.128.0/17
        services: 10.243.0.0/17
    status:
      lastOperation:
        state: Succeeded
---
apiVersion: extensions.gardener.cloud/v1alpha1
kind: Infrastructure
metadata:
  namespace: shoot--foobar--azure
  name: azure-infra
spec:
  type: azure
  region: westeurope
  secretRef:
    namespace: shoot--foobar--azure
    name: core-azure
  providerConfig:
    apiVersion: azure.provider.extensions.gardener.cloud/v1alpha1
    kind: InfrastructureConfig
    networks:
      vnet: # specify either 'name' and 'resourceGroup' or 'cidr'
#        name: my-vnet
#        resourceGroup: my-vnet-group
        cidr: 10.250.0.0/16
#        ddosProtectionPlanID: /subscriptions/test/resourceGroups/test/providers/Microsoft.Network/ddosProtectionPlans/test-ddos-protection-plan
      workers: 10.250.0.0/19
#      # natGateway can only be set together with vnet.workers
#      natGateway:
#        enabled: true
#        sku: Standard  # or StandardV2 for zone-redundant NAT Gateway
#        idleConnectionTimeoutMinutes: 4
#        zone: 1
#        ipAddresses:
#        - name: my-public-ip-name
#          resourceGroup: my-public-ip-resource-group
#          zone: 1
#          # Public IP SKU is automatically derived from natGateway.sku
#      # serviceEndpoints can only be set together with vnet.workers
#      serviceEndpoints:
#      - entry1
#      # specify either networks.workers or networks.zones
#      zones:
#      - name: 1
#        cidr: 10.250.0.0/24
#      - name: 2
#        cidr: 10.250.1.0/24
#        natGateway:
#          enabled: false
#          sku: Standard  # StandardV2 not allowed in per-zone config
#      # subnet: user-managed egress via BYO subnet.
#      # When set, Gardener stops creating the worker subnet, its route table, its NSG, and the NAT
#      # gateway and only discovers them from the referenced (pre-provisioned) subnet. Requires
#      # networks.vnet.name AND networks.vnet.resourceGroup to be set (BYO VNet). Not compatible
#      # with networks.workers, networks.zones, networks.natGateway, networks.serviceEndpoints,
#      # networks.vnet.cidr, or networks.vnet.ddosProtectionPlanID.
#      # The BYO subnet must have an NSG attached before reconcile. It must also have a route table
#      # attached unless the shoot uses an overlay CNI
#      # (shoot.spec.networking.providerConfig.overlay.enabled=true) — in which case the CCM's route
#      # controller is disabled and no route table is required.
#      subnet:
#        name: my-worker-subnet
    zoned: false
