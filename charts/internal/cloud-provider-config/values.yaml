cloud: AZUREPUBLICCLOUD # aka AZURECLOUD. Other possible values: AZURECHINACLOUD/AZUREUSGOVERNMENT
# For workload identity, replace aadClientSecret with the commented fields below.
azureCredentials: |
  aadClientId: fooClient
  aadClientSecret: barSecret
#  aadFederatedTokenFile: /var/run/secrets/gardener.cloud/workload-identity/token
#  useFederatedWorkloadIdentityExtension: true
azureSubscriptionInfo: |
  subscriptionId: barSub
  tenantId: fooTenant
resourceGroup: foobarGroup
vnetName: name
#vnetResourceGroup: vnetResourceGroup
subnetName: sname
routeTableName: rtname
#routeTableResourceGroup: routeTableResourceGroup
securityGroupName: sgname
#securityGroupResourceGroup: securityGroupResourceGroup
# Disable outbound SNAT for user-managed outbound access.
#disableOutboundSNAT: true
region: location
maxNodes: 0
