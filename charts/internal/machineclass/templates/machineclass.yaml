{{- range $index, $machineClass := .Values.machineClasses }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $machineClass.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
{{- if $machineClass.labels }}
  labels: {{- toYaml $machineClass.labels | nindent 4 }}
{{- end }}
type: Opaque
data:
  userData: {{ $machineClass.secret.cloudConfig | b64enc | quote }}
---
apiVersion: machine.sapcloud.io/v1alpha1
kind: MachineClass
metadata:
  name: {{ $machineClass.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
{{- if and $machineClass.operatingSystem $machineClass.labels }}
  labels: {{- merge $machineClass.operatingSystem $machineClass.labels | toYaml | nindent 4 }}
{{- else if $machineClass.operatingSystem }}
  labels: {{- toYaml $machineClass.operatingSystem | nindent 4 }}
{{- else if $machineClass.labels }}
  labels: {{- toYaml $machineClass.labels | nindent 4 }}
{{- end }}
{{- if $machineClass.nodeTemplate }}
nodeTemplate:
  architecture: {{ $machineClass.nodeTemplate.architecture | quote }}
  capacity: {{- toYaml $machineClass.nodeTemplate.capacity | nindent 4 }}
  {{- if $machineClass.nodeTemplate.virtualCapacity }}
  virtualCapacity: {{- toYaml $machineClass.nodeTemplate.virtualCapacity | nindent 4 }}
  {{- end }}
  instanceType: {{ $machineClass.nodeTemplate.instanceType | quote }}
  region: {{ $machineClass.nodeTemplate.region | quote }}
  zone: {{ $machineClass.nodeTemplate.zone | quote }}
{{- end }}
providerSpec:
{{- if hasKey $machineClass "cloudConfiguration" }}
  cloudConfiguration: {{- toYaml $machineClass.cloudConfiguration | nindent 4 }}
{{- end }}
  location: {{ $machineClass.region | quote }}
  properties:
{{- if $machineClass.securityProfile }}
    securityProfile:
  {{- if hasKey $machineClass.securityProfile "securityType" }}
      securityType: {{ $machineClass.securityProfile.securityType | quote }}
  {{- end }}
  {{- if hasKey $machineClass.securityProfile "uefiSettings" }}
      uefiSettings: {{- toYaml $machineClass.securityProfile.uefiSettings | nindent 8 }}
  {{- end }}
{{- end }}
{{- if hasKey $machineClass "zone" }}
    zone: {{ $machineClass.zone }}
{{- end }}
{{- if hasKey $machineClass "machineSet" }}
    machineSet:
      id: {{ $machineClass.machineSet.id | quote }}
      kind: {{ $machineClass.machineSet.kind | quote }}
{{- end }}
{{- if hasKey $machineClass "identityID" }}
    identityID: {{ $machineClass.identityID | quote }}
{{- end }}
{{- if hasKey $machineClass.network "acceleratedNetworking" }}
    networkProfile:
      acceleratedNetworking: {{ $machineClass.network.acceleratedNetworking }}
{{- end }}
{{- if hasKey $machineClass "diagnosticsProfile" }}
    diagnosticsProfile:
      enabled: {{ $machineClass.diagnosticsProfile.enabled }}
  {{- if hasKey $machineClass.diagnosticsProfile "storageURI" }}
      storageURI: {{ $machineClass.diagnosticsProfile.storageURI | quote }}
  {{- end }}
{{- end }}
    hardwareProfile:
      vmSize: {{ $machineClass.machineType | quote }}
    osProfile:
      adminUsername: core
      linuxConfiguration:
        disablePasswordAuthentication: true
        ssh:
          publicKeys:
            path: /home/core/.ssh/authorized_keys
            keyData: {{ $machineClass.sshPublicKey | quote }}
    storageProfile:
      imageReference:
{{- if $machineClass.image.id }}
        id: {{ $machineClass.image.id | quote }}
{{- else if $machineClass.image.communityGalleryImageID }}
        communityGalleryImageID: {{ $machineClass.image.communityGalleryImageID | quote }}
{{- else if $machineClass.image.sharedGalleryImageID }}
        sharedGalleryImageID: {{ $machineClass.image.sharedGalleryImageID | quote }}
{{- else }}
        urn: {{ $machineClass.image.urn | quote }}
  {{- if $machineClass.image.skipMarketplaceAgreement}}
        skipMarketPlaceAgreement: true
  {{- end }}
{{- end }}
      osDisk:
        caching: {{ $machineClass.osDisk.caching | quote }}
        diskSizeGB: {{ $machineClass.osDisk.size }}
        managedDisk:
{{- if hasKey $machineClass.osDisk "type" }}
          storageAccountType: {{ $machineClass.osDisk.type | quote }}
{{- end }}
{{- if hasKey $machineClass.osDisk "securityProfile" }}
          securityProfile:
            securityEncryptionType: {{ $machineClass.osDisk.securityProfile.securityEncryptionType | quote }}
{{- end }}
        createOption: FromImage
{{- if hasKey $machineClass "diskControllerType" }}
      diskControllerType: {{ $machineClass.diskControllerType | quote }}
{{- end }}
{{- if $machineClass.dataDisks }}
      dataDisks: {{- toYaml $machineClass.dataDisks | nindent 6 }}
{{- end }}
{{- if $machineClass.capacityReservation }}
    capacityReservation:
  {{- if $machineClass.capacityReservation.capacityReservationGroupID }}
      capacityReservationGroupID: {{ $machineClass.capacityReservation.capacityReservationGroupID | quote }}
  {{- end }}
{{- end }}
  resourceGroup: {{ $machineClass.resourceGroup | quote }}
  subnetInfo:
    vnetName: {{ $machineClass.network.vnet | quote }}
{{- if hasKey $machineClass.network "vnetResourceGroup" }}
    vnetResourceGroup: {{ $machineClass.network.vnetResourceGroup | quote }}
{{- end }}
    subnetName: {{ $machineClass.network.subnet | quote }}
{{- if $machineClass.tags }}
  tags: {{- toYaml $machineClass.tags | nindent 4 }}
{{- end }}
secretRef:
  name: {{ $machineClass.name | quote }}
  namespace: {{ $.Release.Namespace | quote }}
credentialsSecretRef:
  name: {{ $machineClass.credentialsSecretRef.name | quote }}
  namespace: {{ $machineClass.credentialsSecretRef.namespace | quote }}
provider: "Azure"
{{- end }}
